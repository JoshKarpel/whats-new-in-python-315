# Every hook is `local` and runs a tool from the `dev` group through `uv run`, so the hooks, the editor, `just` and CI
# all run the version `uv.lock` holds, under the same cooldown as every other dependency.
# `--frozen` so a hook never re-locks: the `uv-lock` hook is the one that reports a stale lock.
repos:
  - repo: local
    hooks:
      - id: check-added-large-files
        name: check for added large files
        entry: uv run --frozen check-added-large-files
        language: unsupported
        # The export is one page of SVGs, which outgrows the default limit as the deck grows.
        exclude: ^slides\.html$
      - id: check-case-conflict
        name: check for case conflicts
        entry: uv run --frozen check-case-conflict
        language: unsupported
      - id: check-merge-conflict
        name: check for merge conflicts
        entry: uv run --frozen check-merge-conflict
        language: unsupported
        types: [text]
      - id: check-toml
        name: check toml
        entry: uv run --frozen check-toml
        language: unsupported
        types: [toml]
      - id: detect-private-key
        name: detect private key
        entry: uv run --frozen detect-private-key
        language: unsupported
        types: [text]
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --frozen end-of-file-fixer
        language: unsupported
        types: [text]
        exclude: ^slides\.html$
      - id: forbid-new-submodules
        name: forbid new submodules
        entry: uv run --frozen forbid-new-submodules
        language: unsupported
        types: [directory]
      - id: mixed-line-ending
        name: mixed line ending
        entry: uv run --frozen mixed-line-ending
        language: unsupported
        types: [text]
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --frozen trailing-whitespace-fixer
        language: unsupported
        types: [text]
        exclude: ^slides\.html$

  - repo: local
    hooks:
      - id: check-github-workflows
        name: Validate GitHub Workflows
        entry: uv run --frozen check-jsonschema --builtin-schema vendor.github-workflows
        language: unsupported
        files: ^\.github/workflows/[^/]+$
        types: [yaml]
      - id: zizmor
        name: zizmor
        entry: uv run --frozen zizmor --no-progress
        language: unsupported
        files: (^|/)(\.github/(workflows/[^/]+|dependabot)\.ya?ml|action\.ya?ml|\.pre-commit-(config|hooks)\.ya?ml)$
        types: [yaml]
        require_serial: true

  - repo: local
    hooks:
      - id: format-justfile
        name: format justfile
        entry: mise exec -- just --fmt --unstable
        language: unsupported
        files: ^justfile$
        pass_filenames: false

  - repo: local
    hooks:
      # Check before formatting: a fix can leave code the formatter would change.
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude --fix
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: unsupported
        types_or: [python, pyi]
        require_serial: true

  # `uv` itself is whichever is on `PATH`, not a package in the lock it checks.
  - repo: local
    hooks:
      - id: uv-lock
        name: uv-lock
        entry: uv lock
        language: unsupported
        files: ^(uv\.lock|pyproject\.toml)$
        pass_filenames: false

  # Regenerating is the check: the hook rewrites slides.html, and pre-commit fails the commit when it changes.
  # It calls the module rather than `just export`, since just comes from mise and the hook shouldn't need it.
  - repo: local
    hooks:
      - id: export-slides
        name: export slides.html
        entry: uv run --frozen python -m whats_new export
        language: unsupported
        files: ^(src/|examples/|uv\.lock$)
        pass_filenames: false
