[build-system]
requires = ["uv_build>=0.12.23"]
build-backend = "uv_build"

[project]
name = "whats-new"
version = "0.1.0"
description = "What's New in Python 3.15: an executable talk"
readme = "README.md"
license = "MIT"
authors = [
    { name = "JoshKarpel", email = "josh.karpel@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "counterweight>=0.1.1",
    "numpy>=2.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.4",
    "pre-commit-hooks>=6.0.0",
    "check-jsonschema>=0.38.0",
    "zizmor>=1.30.0",
    "watchfiles>=0.19",
    "pytest>=9.0",
    "pytest-asyncio>=1",
    "ruff>=0.16.10",
]
# The type checkers the typing slides run live. Pinned exactly, since each slide's expected
# output is the verdict of one specific version.
checkers = [
    "mypy==2.4.0",
    "pyright==1.1.414",
    "ty==0.0.87",
    "typing-extensions>=4.15",
]

[tool.uv]
default-groups = ["dev", "checkers"]
exclude-newer = "7 days"
# ty: the typing slides show this exact version's verdicts, observed while planning the talk.
# counterweight, and waxy, its layout engine: the deck tracks their releases closely.
exclude-newer-package = { ty = false, counterweight = false, waxy = false }

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow"]

[tool.mypy]
pretty = true
show_error_codes = true
files = ["src", "tests"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_unused_configs = true
warn_unused_ignores = true
warn_unreachable = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120
# Examples are slide content: each is formatted for the screen, and some are deliberately
# invalid on one interpreter or another.
extend-exclude = ["examples/"]

[tool.ruff.lint]
select = [
    "A",     # https://docs.astral.sh/ruff/rules/#flake8-builtins-a
    "ASYNC", # https://docs.astral.sh/ruff/rules/#flake8-async-async
    "B",     # https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "BLE",   # https://docs.astral.sh/ruff/rules/#flake8-blind-except-ble
    "C4",    # https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    "E",     # https://docs.astral.sh/ruff/rules/#error-e
    "F",     # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "FURB",  # https://docs.astral.sh/ruff/rules/#refurb-furb
    "I",     # https://docs.astral.sh/ruff/rules/#isort-i
    "N",     # https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "PERF",  # https://docs.astral.sh/ruff/rules/#perflint-perf
    "PIE",   # https://docs.astral.sh/ruff/rules/#flake8-pie-pie
    "PLE",   # https://docs.astral.sh/ruff/rules/#error-ple
    "PT",    # https://docs.astral.sh/ruff/rules/#flake8-pytest-style-pt
    "PTH",   # https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
    "RET",   # https://docs.astral.sh/ruff/rules/#flake8-return-ret
    "RUF",   # https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
    "SIM",   # https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
    "UP",    # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "W",     # https://docs.astral.sh/ruff/rules/#warning-w
]
ignore = [
    "E501",  # line length: formatter owns this
    "N818",  # exception names are deliberately descriptive (MissingInterpreter), not Error-suffixed
    "F403",  # star imports, used for counterweight's style utilities
    "F405",  # star imports, used for counterweight's style utilities
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-bugbear]
# Styles are immutable values, so they're safe as defaults.
extend-immutable-calls = [
    "counterweight.styles.Style",
    "counterweight.styles.CellStyle",
    "counterweight.styles.utilities.*",
]
